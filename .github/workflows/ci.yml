name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor
      - name: RLS and permission tests
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql > rls.out
          cat rls.out
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/tests/community_test.sql > community.out
          tail -60 community.out
          FAILED=$(psql "$DB" -tAc "select count(*) from public._t_results where not ok")
          psql "$DB" -tAc "select name from public._t_results where not ok"
          test "$FAILED" = "0"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan files for secrets
        uses: docker://zricethezav/gitleaks:v8.24.3
        with:
          args: dir /github/workspace --redact --verbose
